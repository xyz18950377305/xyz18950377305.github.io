<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>XYZ网站 - 文章</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/styles.css" type="text/css">
</head>
<body>
    <h1>
        <img src="/favicon.png" style="width: 45px; height: auto; margin-bottom: -5px;">
        XYZ网站
    </h1>
    <div class="navbar">
        <a class="btn" href="/首页">首页</a>
        <a class="btn" href="/文章" style="color: yellow;">文章</a>
        <a class="btn" href="/下载/list.html">下载</a>
        <a class="btn" href="/联系">联系</a>
    </div>

    <div class="content">
        <p id="notice">
            加载中…
        </p>
        <ol id="list">

        </ol>
    </div>

    <footer>
        【我的网站】版权所有。网站内容仅供参考，【我的网站】不对其安全性、可靠性、可用性等任何方面提供任何明示或暗示。【我的网站】保留修改、删除、更新网站内容等所有权力。
    </footer>

    <script>
        const listEl   = document.getElementById('list');
        const noticeEl = document.getElementById('notice');

        function showNotice(msg) {
            noticeEl.textContent = msg;
            noticeEl.style.display = '';
            listEl.style.display = 'none';
        }

        function showList(html) {
            noticeEl.style.display = 'none';
            listEl.innerHTML = html;
            listEl.style.display = '';
        }

        fetch('./list.json')
            .then(r => {
                if (!r.ok) throw new Error('清单读取失败');
                return r.json();
            })
            .then(list => {
                const shown = list.filter(p => p.show !== false);

                if (!shown.length) {
                    showNotice('暂无文章');
                    return;
                }
                showList(shown.map(p => `
                    <li>
                        <a href="text.html?title=${encodeURIComponent(p.title)}&path=${encodeURIComponent(p.path)}">${p.title}</a>
                        <span style="margin-left: 10px; color: #5f5f5f">[${p.time}]</span>
                    </li>
                `).join(''));
            })
            .catch(e => {
                showNotice('加载失败：' + e.message);
            });
    </script>
</body>
</html>
